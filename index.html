<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortnite Rift Experience</title>
    <style>
      :root {
        --bg-1: #040a16;
        --bg-2: #0b1630;
        --pink: #ff4fd8;
        --purple: #7b61ff;
        --blue: #4fd4ff;
        --green: #8dffb2;
        --gold: #ffd166;
        --text: #edf5ff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #040a16;
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
      }

      body {
        position: relative;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 10%, rgba(138, 92, 255, 0.28), transparent 25%),
          radial-gradient(circle at 15% 18%, rgba(79, 212, 255, 0.18), transparent 22%),
          radial-gradient(circle at 80% 12%, rgba(255, 79, 216, 0.22), transparent 28%),
          linear-gradient(to bottom, rgba(19,21,35,0.8), rgba(4,7,15,1) 40%, rgba(2,4,9,1));
      }

      .glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 48%, rgba(255, 79, 216, 0.28), transparent 18%),
          radial-gradient(circle at 50% 38%, rgba(79, 212, 255, 0.18), transparent 22%),
          radial-gradient(circle at 50% 62%, rgba(139, 94, 255, 0.24), transparent 30%);
        animation: glowPulse 7s ease-in-out infinite alternate;
      }

      @keyframes glowPulse {
        0% { opacity: 0.7; transform: scale(1); }
        100% { opacity: 1; transform: scale(1.12); }
      }

      .stars {
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.9), transparent),
          radial-gradient(2px 2px at 18% 48%, rgba(255,255,255,0.8), transparent),
          radial-gradient(1.5px 1.5px at 26% 76%, rgba(255,255,255,0.9), transparent),
          radial-gradient(2px 2px at 36% 28%, rgba(255,255,255,0.7), transparent),
          radial-gradient(2px 2px at 50% 16%, rgba(255,255,255,0.9), transparent),
          radial-gradient(1.5px 1.5px at 62% 32%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 74% 20%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 86% 48%, rgba(255,255,255,0.9), transparent),
          radial-gradient(1.5px 1.5px at 95% 30%, rgba(255,255,255,0.7), transparent),
          radial-gradient(2px 2px at 70% 72%, rgba(255,255,255,0.9), transparent),
          radial-gradient(2px 2px at 14% 84%, rgba(255,255,255,0.85), transparent),
          radial-gradient(1.5px 1.5px at 51% 86%, rgba(255,255,255,0.8), transparent);
        opacity: 0.9;
        animation: twinkle 12s ease-in-out infinite alternate;
      }

      @keyframes twinkle {
        0% { opacity: 0.5; }
        100% { opacity: 1; }
      }

      .moon {
        position: absolute;
        width: 170px;
        height: 170px;
        right: 10%;
        top: 12%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, rgba(255,255,255,1), rgba(217,228,255,0.9) 40%, rgba(255,255,255,0.12) 72%, transparent 100%);
        box-shadow: 0 0 30px rgba(255,255,255,0.5), 0 0 80px rgba(104,175,255,0.45);
      }

      .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 22px 34px;
        z-index: 20;
        background: linear-gradient(to bottom, rgba(7,12,22,0.8), rgba(7,12,22,0));
      }

      .brand {
        font-size: 0.8rem;
        font-weight: 900;
        letter-spacing: 0.36em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.9);
      }

      .live {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.8);
      }

      .live-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 16px rgba(141,255,178,0.9);
        animation: blink 1.3s ease-in-out infinite alternate;
      }

      @keyframes blink {
        0% { opacity: 0.6; }
        100% { opacity: 1; }
      }

      .title-wrap {
        position: absolute;
        left: 50%;
        top: 14%;
        transform: translateX(-50%);
        text-align: center;
        z-index: 15;
      }

      .small-label {
        font-size: 0.72rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.76);
      }

      .big-title {
        margin-top: 14px;
        font-size: clamp(2.5rem, 6vw, 8rem);
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #ffffff 0%, #f7d6ff 16%, #9fd7ff 42%, #d1ffef 68%, #ffe8a4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 18px rgba(155, 95, 255, 0.25);
      }

      .subtitle {
        margin-top: 12px;
        font-size: 0.8rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.78);
      }

      .left-hud, .right-hud {
        position: absolute;
        bottom: 16%;
        z-index: 18;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .left-hud { left: 3.5%; }
      .right-hud { right: 3.5%; align-items: flex-end; }

      .hud-pill, .stat-box {
        background: rgba(12, 18, 29, 0.56);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 26px rgba(0,0,0,0.25);
      }

      .hud-pill {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        border-radius: 999px;
      }

      .pill-tag {
        font-size: 0.62rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.65);
      }

      .pill-value {
        font-size: 1rem;
        font-weight: 700;
      }

      .stat-box {
        min-width: 170px;
        padding: 12px 18px;
        border-radius: 16px;
      }

      .stat-box .label {
        display: block;
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.66);
        margin-bottom: 8px;
      }

      .stat-box .value {
        font-size: 1.42rem;
        font-weight: 800;
      }

      .stage-wrap {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(90vw, 1250px);
        height: 56vh;
        transform: translateX(-50%);
        z-index: 3;
      }

      .stage {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100%;
        background: linear-gradient(to bottom, rgba(6,10,18,0.2), rgba(2,4,9,0.82) 22%, rgba(1,2,6,0.98));
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -12px 28px rgba(0,0,0,0.56), 0 0 30px rgba(79,212,255,0.2);
      }

      .stage::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 70%;
        background: linear-gradient(to bottom, rgba(54,84,164,0.2), rgba(0,0,0,0));
      }

      .beam {
        position: absolute;
        width: 18%;
        height: 72%;
        bottom: 24%;
        background: linear-gradient(to top, rgba(255,255,255,0.05), rgba(255,255,255,0.18), transparent);
        filter: blur(12px);
        animation: beamPulse 4s ease-in-out infinite alternate;
      }

      .beam-1 { left: 16%; }
      .beam-2 { left: 42%; }
      .beam-3 { right: 16%; }

      @keyframes beamPulse {
        0% { opacity: 0.45; }
        100% { opacity: 1; }
      }

      .screen {
        position: absolute;
        left: 50%;
        bottom: 17%;
        width: min(62vw, 800px);
        height: 38vh;
        transform: translateX(-50%);
        border-radius: 20px 20px 10px 10px;
        background:
          linear-gradient(180deg, rgba(20,16,56,0.82), rgba(8,15,30,0.8)),
          linear-gradient(135deg, rgba(255,79,216,0.12), rgba(79,212,255,0.1));
        border: 1px solid rgba(255,255,255,0.14);
        box-shadow: inset 0 0 40px rgba(255,255,255,0.04), 0 0 36px rgba(123, 97, 255, 0.18);
        overflow: hidden;
      }

      .screen::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
        background-size: 26px 26px;
      }

      .screen::after {
        content: "";
        position: absolute;
        left: 10%;
        right: 10%;
        top: 18%;
        height: 40%;
        background: linear-gradient(90deg, rgba(255,79,216,0.12), rgba(79,212,255,0.18), rgba(141,255,178,0.1));
        filter: blur(16px);
      }

      .screen-logo {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: clamp(2.8rem, 6vw, 7rem);
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #ff4fd8 0%, #7b61ff 18%, #4fd4ff 46%, #8dffb2 72%, #ffd166 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 18px rgba(130, 108, 255, 0.3);
        white-space: nowrap;
      }

      .lights {
        position: absolute;
        left: 50%;
        bottom: 8%;
        width: 82%;
        height: 24%;
        transform: translateX(-50%);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
      }

      .light {
        width: 13%;
        height: 100%;
        border-radius: 18px 18px 8px 8px;
        background: linear-gradient(to top, rgba(255,255,255,0.08), rgba(255,255,255,0.75));
        box-shadow: 0 0 18px rgba(255,255,255,0.16);
        animation: flicker 1.8s ease-in-out infinite alternate;
      }

      .light:nth-child(2n) { animation-delay: 0.5s; }
      .light:nth-child(3n) { animation-delay: 0.8s; }

      @keyframes flicker {
        0% { opacity: 0.35; }
        100% { opacity: 1; }
      }

      .crowd {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 28vh;
        display: flex;
        align-items: flex-end;
        justify-content: space-evenly;
        padding: 0 3%;
        opacity: 0.98;
      }

      .person {
        position: relative;
        width: 20px;
        height: 80px;
        margin: 0 3px;
        background: linear-gradient(to bottom, transparent 0 18%, var(--c) 18% 100%);
        border-radius: 10px 10px 0 0;
        animation: crowdWave 2.8s ease-in-out infinite alternate;
      }

      .person::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -12px;
        width: 15px;
        height: 15px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: var(--c);
      }

      .person:nth-child(2n) { animation-delay: 0.2s; }
      .person:nth-child(3n) { animation-delay: 0.45s; }
      .person:nth-child(4n) { animation-delay: 0.75s; }

      @keyframes crowdWave {
        0% { transform: translateY(0) scaleY(1); opacity: 0.7; }
        100% { transform: translateY(8px) scaleY(1.06); opacity: 1; }
      }

      .artist {
        position: absolute;
        left: 50%;
        bottom: 12%;
        width: min(22vw, 200px);
        height: min(45vw, 330px);
        transform: translateX(-50%);
        filter: drop-shadow(0 26px 20px rgba(0,0,0,0.5));
        animation: floatArtist 5s ease-in-out infinite alternate;
        z-index: 10;
      }

      @keyframes floatArtist {
        0% { transform: translateX(-50%) translateY(0); }
        100% { transform: translateX(-50%) translateY(-12px); }
      }

      .artist-head {
        position: absolute;
        left: 50%;
        top: 4%;
        width: 82px;
        height: 82px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: linear-gradient(135deg, #f7dfc2, #d89b6f);
        box-shadow: inset -12px -12px rgba(0,0,0,0.07);
      }

      .artist-head::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 26%;
        width: 42px;
        height: 14px;
        transform: translateX(-50%);
        background: rgba(70, 45, 28, 0.72);
        border-radius: 12px;
      }

      .artist-body {
        position: absolute;
        left: 50%;
        top: 24%;
        width: 120px;
        height: 128px;
        transform: translateX(-50%);
        border-radius: 22px 22px 30px 30px;
        background: linear-gradient(135deg, rgba(255,79,216,0.9), rgba(123,97,255,0.9));
        box-shadow: inset -10px -8px rgba(0,0,0,0.12), 0 0 26px rgba(255,79,216,0.22);
      }

      .artist-body::before, .artist-body::after {
        content: "";
        position: absolute;
        top: 26px;
        width: 18px;
        height: 84px;
        border-radius: 12px;
        background: rgba(255,255,255,0.7);
      }

      .artist-body::before { left: 20px; }
      .artist-body::after { right: 20px; }

      .artist-arm {
        position: absolute;
        top: 34%;
        width: 24px;
        height: 106px;
        border-radius: 18px;
        background: linear-gradient(180deg, #f4d7b7, #dca070);
      }

      .artist-arm.left { left: 15%; transform: rotate(18deg); }
      .artist-arm.right { right: 15%; transform: rotate(-18deg); }

      .artist-leg {
        position: absolute;
        bottom: 0;
        width: 28px;
        height: 120px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(22,22,28,0.9), rgba(8,9,13,1));
      }

      .artist-leg.left { left: 41%; }
      .artist-leg.right { right: 41%; }

      .bars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .bar {
        position: absolute;
        width: 7px;
        height: 180px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(123,97,255,0.15), transparent);
        animation: rise 5s ease-in-out infinite alternate;
      }

      .bar:nth-child(1) { left: 14%; top: 10%; }
      .bar:nth-child(2) { left: 29%; top: 22%; animation-delay: 0.4s; }
      .bar:nth-child(3) { right: 29%; top: 18%; animation-delay: 0.7s; }
      .bar:nth-child(4) { right: 12%; top: 8%; animation-delay: 0.9s; }

      @keyframes rise {
        0% { opacity: 0.4; transform: scaleY(0.7); }
        100% { opacity: 1; transform: scaleY(1.18); }
      }

      @media (max-width: 900px) {
        .left-hud, .right-hud { display: none; }
        .stage-wrap { width: 95vw; }
        .screen { width: 82vw; }
        .artist { width: 160px; }
        .big-title { font-size: clamp(2.3rem, 10vw, 4.6rem); }
        .small-label, .subtitle { letter-spacing: 0.18em; }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="glow"></div>
      <div class="stars"></div>
      <div class="moon"></div>

      <div class="top-bar">
        <div class="brand">Fortnite Rift</div>
        <div class="live"><span class="live-dot"></span> Live Event</div>
      </div>

      <div class="title-wrap">
        <div class="small-label">Concert Experience</div>
        <div class="big-title">Rift</div>
        <div class="subtitle">Travis Scott Special</div>
      </div>

      <div class="left-hud">
        <div class="hud-pill">
          <span class="pill-tag">Mode</span>
          <span class="pill-value">Spectator</span>
        </div>
        <div class="hud-pill">
          <span class="pill-tag">Crowd</span>
          <span class="pill-value">32K+</span>
        </div>
      </div>

      <div class="right-hud">
        <div class="stat-box">
          <span class="label">Energy</span>
          <span class="value">99%</span>
        </div>
        <div class="stat-box">
          <span class="label">Phase</span>
          <span class="value">Portal</span>
        </div>
      </div>

      <div class="bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="stage-wrap">
        <div class="stage"></div>
        <div class="beam beam-1"></div>
        <div class="beam beam-2"></div>
        <div class="beam beam-3"></div>

        <div class="screen">
          <div class="screen-logo">RIFT</div>
        </div>

        <div class="lights">
          <div class="light"></div>
          <div class="light"></div>
          <div class="light"></div>
          <div class="light"></div>
          <div class="light"></div>
          <div class="light"></div>
        </div>

        <div class="artist">
          <div class="artist-arm left"></div>
          <div class="artist-head"></div>
          <div class="artist-body"></div>
          <div class="artist-arm right"></div>
          <div class="artist-leg left"></div>
          <div class="artist-leg right"></div>
        </div>

        <div class="crowd">
          <div class="person" style="--c: #ff4fd8; height: 58px"></div>
          <div class="person" style="--c: #4fd4ff; height: 72px"></div>
          <div class="person" style="--c: #a883ff; height: 82px"></div>
          <div class="person" style="--c: #ffd166; height: 60px"></div>
          <div class="person" style="--c: #8dffb2; height: 76px"></div>
          <div class="person" style="--c: #ff8fb1; height: 66px"></div>
          <div class="person" style="--c: #7b61ff; height: 80px"></div>
          <div class="person" style="--c: #4fd4ff; height: 62px"></div>
          <div class="person" style="--c: #ff4fd8; height: 78px"></div>
          <div class="person" style="--c: #8dffb2; height: 58px"></div>
          <div class="person" style="--c: #ffd166; height: 68px"></div>
          <div class="person" style="--c: #4fd4ff; height: 66px"></div>
          <div class="person" style="--c: #a883ff; height: 64px"></div>
          <div class="person" style="--c: #ff90d5; height: 74px"></div>
          <div class="person" style="--c: #7df6ff; height: 62px"></div>
          <div class="person" style="--c: #d6ff8d; height: 78px"></div>
          <div class="person" style="--c: #ffb86e; height: 64px"></div>
          <div class="person" style="--c: #7b61ff; height: 82px"></div>
          <div class="person" style="--c: #ff4fd8; height: 60px"></div>
          <div class="person" style="--c: #4fd4ff; height: 76px"></div>
          <div class="person" style="--c: #8dffb2; height: 64px"></div>
          <div class="person" style="--c: #ffd166; height: 78px"></div>
          <div class="person" style="--c: #a883ff; height: 70px"></div>
        </div>
      </div>
    </div>
  </body>
</html>
