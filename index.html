<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fortnite Rift Experience</title>
    <style>
      :root {
        --bg-1: #070b17;
        --bg-2: #0d1630;
        --pink: #ff4fd8;
        --purple: #7b61ff;
        --blue: #4fd4ff;
        --green: #8dffb2;
        --gold: #ffd166;
        --text: #edf5ff;
        --shadow: rgba(0, 0, 0, 0.38);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: radial-gradient(circle at top, #172b4d 0%, var(--bg-1) 32%, #050912 100%);
        color: var(--text);
        font-family: Inter, Arial, sans-serif;
        overflow: hidden;
      }

      body {
        position: relative;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          linear-gradient(to bottom, rgba(67, 121, 255, 0.12), rgba(7, 11, 23, 0.15)),
          radial-gradient(circle at center, rgba(150, 80, 255, 0.18), rgba(0, 0, 0, 0.2) 40%, rgba(0,0,0,0.6));
      }

      .sky-glow {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(circle at 50% 18%, rgba(155, 92, 255, 0.35), transparent 20%),
          radial-gradient(circle at 8% 10%, rgba(79, 212, 255, 0.18), transparent 25%),
          radial-gradient(circle at 90% 24%, rgba(255, 79, 216, 0.2), transparent 30%);
        animation: pulseGlow 8s ease-in-out infinite alternate;
      }

      @keyframes pulseGlow {
        0% { transform: scale(1); opacity: 0.8; }
        100% { transform: scale(1.12); opacity: 1; }
      }

      .stars, .stars::before, .stars::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 30% 60%, rgba(255,255,255,0.7), transparent),
          radial-gradient(2px 2px at 45% 40%, rgba(255,255,255,0.8), transparent),
          radial-gradient(1.5px 1.5px at 80% 30%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 70% 70%, rgba(255,255,255,0.85), transparent),
          radial-gradient(2px 2px at 90% 15%, rgba(255,255,255,0.7), transparent),
          radial-gradient(1.5px 1.5px at 60% 80%, rgba(255,255,255,0.8), transparent),
          radial-gradient(2px 2px at 15% 80%, rgba(255,255,255,0.8), transparent);
        opacity: 0.7;
        animation: shimmer 12s linear infinite alternate;
      }

      @keyframes shimmer {
        0% { transform: translateY(0); opacity: 0.5; }
        100% { transform: translateY(6px); opacity: 1; }
      }

      .moon {
        position: absolute;
        width: 180px;
        height: 180px;
        right: 12%;
        top: 12%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #fff, #dfe8ff 40%, rgba(255,255,255,0.18) 70%, transparent 100%);
        box-shadow: 0 0 40px rgba(231, 239, 255, 0.7), 0 0 90px rgba(147, 192, 255, 0.4);
        opacity: 0.9;
      }

      .stage {
        position: absolute;
        left: 50%;
        bottom: 0;
        width: min(90vw, 1200px);
        height: 55vh;
        transform: translateX(-50%);
        background: linear-gradient(to bottom, rgba(8, 9, 18, 0.1), rgba(3, 4, 8, 0.8) 25%, rgba(5,7,12,0.98));
        border-radius: 18px 18px 0 0;
        box-shadow: 0 -10px 30px rgba(1, 2, 8, 0.6), 0 0 26px rgba(79, 212, 255, 0.2);
      }

      .stage::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 68%;
        background: linear-gradient(to bottom, rgba(46, 69, 120, 0.2), rgba(3,4,10,0));
      }

      .light-beam {
        position: absolute;
        width: 18%;
        height: 60%;
        bottom: 26%;
        background: linear-gradient(to top, rgba(255,255,255,0.09), rgba(255,255,255,0), rgba(255,255,255,0.08));
        filter: blur(10px);
        transform: skewX(-10deg);
        animation: beamPulse 4s ease-in-out infinite alternate;
      }

      .beam-1 { left: 18%; }
      .beam-2 { left: 42%; }
      .beam-3 { right: 18%; }

      @keyframes beamPulse {
        0% { opacity: 0.45; }
        100% { opacity: 1; }
      }

      .main-screen {
        position: absolute;
        left: 50%;
        bottom: 18%;
        width: min(60vw, 780px);
        height: 40vh;
        transform: translateX(-50%);
        border-radius: 16px 16px 12px 12px;
        background:
          linear-gradient(180deg, rgba(21,16,66,0.6), rgba(12,24,46,0.85)),
          radial-gradient(circle at 50% 30%, rgba(255,79,216,0.16), transparent 30%);
        border: 1px solid rgba(255,255,255,0.16);
        box-shadow: inset 0 0 40px rgba(255,255,255,0.04), 0 0 30px rgba(123,97,255,0.22);
        overflow: hidden;
      }

      .main-screen::before {
        content: "";
        position: absolute;
        inset: 18% 10% auto 10%;
        height: 40%;
        background: linear-gradient(90deg, rgba(255,79,216,0.12), rgba(79,212,255,0.2), rgba(141,255,178,0.1));
        filter: blur(20px);
      }

      .screen-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
        background-size: 26px 26px;
        mix-blend-mode: screen;
      }

      .screen-logo {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-weight: 900;
        font-size: clamp(2.8rem, 6vw, 7rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: linear-gradient(90deg, #ff4fd8 0%, #7b61ff 18%, #4fd4ff 48%, #8dffb2 72%, #ffd166 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-shadow: 0 0 16px rgba(255,255,255,0.18);
        filter: drop-shadow(0 0 18px rgba(123, 97, 255, 0.24));
        white-space: nowrap;
      }

      .inset-lights {
        position: absolute;
        left: 50%;
        bottom: 10%;
        width: 80%;
        height: 26%;
        transform: translateX(-50%);
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        opacity: 0.88;
      }

      .light {
        width: 14%;
        height: 100%;
        border-radius: 18px 18px 10px 10px;
        background: linear-gradient(to top, rgba(255,255,255,0.08), rgba(255,255,255,0.8));
        box-shadow: 0 0 14px rgba(255,255,255,0.2);
        animation: flicker 1.7s infinite alternate;
      }

      .light:nth-child(2n) { animation-delay: 0.4s; }
      .light:nth-child(3n) { animation-delay: 0.8s; }

      @keyframes flicker {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }

      .crowd {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 28vh;
        display: flex;
        align-items: flex-end;
        justify-content: space-evenly;
        padding: 0 5%;
        opacity: 0.9;
      }

      .crowd .person {
        position: relative;
        width: 22px;
        height: 70px;
        margin: 0 3px;
        background: linear-gradient(to bottom, transparent 0 18%, var(--person-color) 18% 100%);
        border-radius: 10px 10px 0 0;
        box-shadow: 0 0 12px rgba(255, 255, 255, 0.1);
        animation: crowdMove 3s ease-in-out infinite alternate;
      }

      .crowd .person::before {
        content: "";
        position: absolute;
        left: 50%;
        top: -12px;
        width: 16px;
        height: 16px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: var(--person-color);
        box-shadow: 0 0 8px rgba(255,255,255,0.15);
      }

      .crowd .person:nth-child(2n) { animation-delay: 0.2s; }
      .crowd .person:nth-child(3n) { animation-delay: 0.6s; }
      .crowd .person:nth-child(4n) { animation-delay: 0.9s; }

      @keyframes crowdMove {
        0% { transform: translateY(0) scaleY(1); opacity: 0.8; }
        100% { transform: translateY(7px) scaleY(1.05); opacity: 1; }
      }

      .giant-figure {
        position: absolute;
        left: 50%;
        bottom: 14%;
        width: min(26vw, 220px);
        height: min(48vw, 360px);
        transform: translateX(-50%);
        filter: drop-shadow(0 30px 30px rgba(0,0,0,0.5));
        animation: floatFigure 5s ease-in-out infinite alternate;
      }

      @keyframes floatFigure {
        0% { transform: translateX(-50%) translateY(0); }
        100% { transform: translateX(-50%) translateY(-12px); }
      }

      .figure-head {
        position: absolute;
        left: 50%;
        top: 6%;
        width: 84px;
        height: 84px;
        transform: translateX(-50%);
        border-radius: 50%;
        background: linear-gradient(135deg, #f7d9b6, #d9a77c);
        box-shadow: inset -12px -8px rgba(0,0,0,0.08);
      }

      .figure-head::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 24%;
        width: 42px;
        height: 16px;
        transform: translateX(-50%);
        border-radius: 18px;
        background: rgba(77, 48, 28, 0.8);
      }

      .figure-body {
        position: absolute;
        left: 50%;
        top: 24%;
        width: 118px;
        height: 130px;
        transform: translateX(-50%);
        border-radius: 18px 18px 24px 24px;
        background: linear-gradient(135deg, rgba(255,79,216,0.9), rgba(123,97,255,0.9));
        box-shadow: inset -10px -8px rgba(0,0,0,0.12), 0 0 30px rgba(255,79,216,0.25);
      }

      .figure-body::before,
      .figure-body::after {
        content: "";
        position: absolute;
        width: 18px;
        height: 86px;
        top: 20px;
        border-radius: 12px;
        background: rgba(255,255,255,0.8);
      }

      .figure-body::before { left: 20px; }
      .figure-body::after { right: 20px; }

      .figure-arm, .figure-arm::before {
        position: absolute;
        width: 26px;
        height: 110px;
        border-radius: 18px;
        background: linear-gradient(180deg, #f2d5af, #d9a77c);
        top: 30%;
      }

      .figure-arm { left: 14%; transform: rotate(18deg); }
      .figure-arm::before {
        content: "";
        left: 0;
        top: 88px;
        width: 22px;
        height: 90px;
        border-radius: 16px;
      }

      .figure-arm.right {
        left: auto;
        right: 14%;
        transform: rotate(-18deg);
      }

      .figure-leg {
        position: absolute;
        width: 28px;
        height: 120px;
        border-radius: 12px;
        background: linear-gradient(180deg, rgba(28,28,34,0.9), rgba(9,10,14,1));
        bottom: 0;
      }

      .figure-leg.left { left: 42%; }
      .figure-leg.right { right: 42%; }

      .floating-bars {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .bar {
        position: absolute;
        width: 8px;
        height: 180px;
        background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(123,97,255,0.18), transparent);
        opacity: 0.7;
        animation: rise 5s ease-in-out infinite alternate;
      }

      .bar:nth-child(1) { left: 10%; top: 10%; }
      .bar:nth-child(2) { left: 25%; top: 22%; animation-delay: 0.3s; }
      .bar:nth-child(3) { left: 75%; top: 18%; animation-delay: 0.8s; }
      .bar:nth-child(4) { right: 12%; top: 12%; animation-delay: 0.5s; }

      @keyframes rise {
        0% { transform: scaleY(0.8); opacity: 0.5; }
        100% { transform: scaleY(1.18); opacity: 1; }
      }

      .top-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 90px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 32px;
        z-index: 4;
        background: linear-gradient(to bottom, rgba(5, 8, 16, 0.6), rgba(5,8,16,0));
      }

      .brand {
        font-weight: 900;
        letter-spacing: 0.26em;
        font-size: 0.8rem;
        text-transform: uppercase;
        color: rgba(255,255,255,0.92);
      }

      .status {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 0.7rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.8);
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 12px var(--green);
        animation: blink 1.2s ease-in-out infinite alternate;
      }

      @keyframes blink {
        0% { opacity: 0.6; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1.1); }
      }

      .hud {
        position: absolute;
        left: 4%;
        bottom: 14%;
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }

      .hud-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(9, 17, 30, 0.52);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(8px);
        box-shadow: 0 8px 18px rgba(0,0,0,0.2);
      }

      .pill-tag {
        font-size: 0.63rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.7);
      }

      .pill-value {
        font-size: 1rem;
        font-weight: 700;
      }

      .right-stats {
        position: absolute;
        right: 4%;
        bottom: 16%;
        z-index: 6;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 14px;
      }

      .stat-box {
        min-width: 180px;
        padding: 12px 18px;
        border-radius: 16px;
        background: rgba(10, 14, 22, 0.58);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(6px);
      }

      .stat-box .label {
        display: block;
        font-size: 0.62rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.68);
        margin-bottom: 8px;
      }

      .stat-box .value {
        font-size: 1.4rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--text);
      }

      .center-label {
        position: absolute;
        left: 50%;
        top: 14%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .small-label {
        font-size: 0.7rem;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.75);
      }

      .title {
        font-size: clamp(2.5rem, 5vw, 6rem);
        line-height: 0.9;
        font-weight: 900;
        background: linear-gradient(90deg, #ffffff 0%, #ffdbff 18%, #8ad7ff 44%, #b7ffdd 68%, #f0e7a9 100%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(170, 140, 255, 0.3);
      }

      .subtitle {
        font-size: 0.9rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        opacity: 0.8;
      }

      @media (max-width: 900px) {
        .top-bar {
          padding: 16px 18px;
        }

        .brand, .status {
          letter-spacing: 0.12em;
          font-size: 0.6rem;
        }

        .hud, .right-stats {
          display: none;
        }

        .title {
          font-size: clamp(2.1rem, 9vw, 4rem);
        }

        .subtitle {
          letter-spacing: 0.12em;
          font-size: 0.7rem;
        }

        .main-screen {
          width: 82vw;
          height: 32vh;
        }

        .figure-head {
          width: 64px;
          height: 64px;
        }
      }
    </style>
  </head>
  <body>
    <div class="scene">
      <div class="sky-glow"></div>
      <div class="stars"></div>
      <div class="moon"></div>

      <div class="top-bar">
        <div class="brand">Fortnite Rift</div>
        <div class="status"><span class="dot"></span> Live Event</div>
      </div>

      <div class="center-label">
        <div class="small-label">Concert Experience</div>
        <div class="title">Rift</div>
        <div class="subtitle">Travis Scott Special</div>
      </div>

      <div class="hud">
        <div class="hud-pill">
          <span class="pill-tag">Mode</span>
          <span class="pill-value">Spectator</span>
        </div>
        <div class="hud-pill">
          <span class="pill-tag">Crowd</span>
          <span class="pill-value">32K+</span>
        </div>
      </div>

      <div class="right-stats">
        <div class="stat-box">
          <span class="label">Energy</span>
          <span class="value">99%</span>
        </div>
        <div class="stat-box">
          <span class="label">Phase</span>
          <span class="value">Portal</span>
        </div>
      </div>

      <div class="floating-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>

      <div class="light-beam beam-1"></div>
      <div class="light-beam beam-2"></div>
      <div class="light-beam beam-3"></div>

      <div class="main-screen">
        <div class="screen-grid"></div>
        <div class="screen-logo">RIFT</div>
      </div>

      <div class="inset-lights">
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
        <div class="light"></div>
      </div>

      <div class="giant-figure">
        <div class="figure-arm"></div>
        <div class="figure-head"></div>
        <div class="figure-body"></div>
        <div class="figure-arm right"></div>
        <div class="figure-leg left"></div>
        <div class="figure-leg right"></div>
      </div>

      <div class="stage"></div>

      <div class="crowd">
        <div class="person" style="--person-color: #ff4fd8; height: 54px"></div>
        <div class="person" style="--person-color: #4fd4ff; height: 62px"></div>
        <div class="person" style="--person-color: #a883ff; height: 80px"></div>
        <div class="person" style="--person-color: #ffd166; height: 58px"></div>
        <div class="person" style="--person-color: #8dffb2; height: 72px"></div>
        <div class="person" style="--person-color: #ff8fb1; height: 65px"></div>
        <div class="person" style="--person-color: #7b61ff; height: 76px"></div>
        <div class="person" style="--person-color: #4fd4ff; height: 60px"></div>
        <div class="person" style="--person-color: #ff4fd8; height: 78px"></div>
        <div class="person" style="--person-color: #8dffb2; height: 56px"></div>
        <div class="person" style="--person-color: #ffd166; height: 68px"></div>
        <div class="person" style="--person-color: #4fd4ff; height: 66px"></div>
        <div class="person" style="--person-color: #a883ff; height: 64px"></div>
        <div class="person" style="--person-color: #ff90d5; height: 72px"></div>
        <div class="person" style="--person-color: #7df6ff; height: 60px"></div>
        <div class="person" style="--person-color: #d6ff8d; height: 75px"></div>
        <div class="person" style="--person-color: #ffb86e; height: 62px"></div>
        <div class="person" style="--person-color: #7b61ff; height: 80px"></div>
        <div class="person" style="--person-color: #ff4fd8; height: 58px"></div>
        <div class="person" style="--person-color: #4fd4ff; height: 74px"></div>
        <div class="person" style="--person-color: #8dffb2; height: 61px"></div>
        <div class="person" style="--person-color: #ffd166; height: 77px"></div>
        <div class="person" style="--person-color: #a883ff; height: 69px"></div>
      </div>
    </div>
  </body>
</html>
